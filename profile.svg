<!-- profile.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Lorenzo Leognano - Student of Cybersecurity">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="sep" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="350" y="224" width="0" height="28"><animate attributeName="width" from="0" to="560" dur="1.0s" begin="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="350" y="258" width="0" height="28"><animate attributeName="width" from="0" to="560" dur="1.5s" begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="350" y="292" width="0" height="28"><animate attributeName="width" from="0" to="560" dur="1.4s" begin="3.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="350" y="326" width="0" height="28"><animate attributeName="width" from="0" to="560" dur="1.4s" begin="5.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .title { font-size: 58px; font-weight: 700; letter-spacing: 6px; }
    .sub   { font-size: 15px; letter-spacing: 8px; fill: #8b949e; }
    .term  { font-size: 16px; fill: #c9d1d9; }
    .dim   { fill: #6e7681; }
    .bin   { font-size: 11px; fill: #ffffff; opacity: 0.07; letter-spacing: 2px; }
    .tag   { font-size: 12px; fill: #6e7681; letter-spacing: 3px; }
    .corner { fill: none; stroke: #6e7681; stroke-width: 1.5; }
    .g1 { animation: gl1 4s infinite steps(1); }
    .g2 { animation: gl2 4s infinite steps(1); }
    .blink { animation: blink 1s infinite steps(1); }
    .sweep { animation: sweep 7s linear infinite; }
    @keyframes gl1 {
      0%, 88%, 100% { transform: translate(0, 0); }
      89% { transform: translate(-5px, 1px); }
      91% { transform: translate(4px, -1px); }
      93% { transform: translate(-2px, 0); }
    }
    @keyframes gl2 {
      0%, 88%, 100% { transform: translate(0, 0); }
      89% { transform: translate(5px, -1px); }
      91% { transform: translate(-4px, 1px); }
      93% { transform: translate(2px, 0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes sweep { 0% { transform: translateY(-60px); } 100% { transform: translateY(480px); } }
  </style>

  <!-- background -->
  <rect width="1200" height="420" rx="12" fill="#000000"/>
  <rect width="1200" height="420" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="12" fill="url(#scan)"/>

  <!-- scan beam -->
  <rect class="sweep" x="0" y="0" width="1200" height="50" fill="url(#beam)"/>

  <!-- binary noise -->
  <text class="bin" x="28" y="66">01001100 01001111 01010010 01000101 01001110 01011010 01001111</text>
  <text class="bin" x="28" y="84">10110011 00101101 11010010 01101001 10010110 01001011 10100101</text>
  <text class="bin" x="28" y="372">01000011 01011001 01000010 01000101 01010010 00100000 01010011</text>
  <text class="bin" x="760" y="372">01010011 01000101 01000011 01010101 01010010 01000101</text>
  <text class="bin" x="760" y="390">11001010 01010110 10101001 00110101 11100010 01101100</text>

  <!-- corners -->
  <path class="corner" d="M18 46 V18 H46"/>
  <path class="corner" d="M1154 18 H1182 V46"/>
  <path class="corner" d="M18 374 V402 H46"/>
  <path class="corner" d="M1154 402 H1182 V374"/>

  <!-- labels -->
  <text class="tag" x="62" y="38">// README.md</text>
  <text class="tag" x="1138" y="38" text-anchor="end">STATUS: ONLINE</text>
  <circle cx="1152" cy="33" r="3" fill="#ffffff"><animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/></circle>

  <!-- glitch title -->
  <g class="g1"><text class="title" x="600" y="138" text-anchor="middle" fill="#5c0a14" opacity="0.9">LORENZO LEOGNANO</text></g>
  <g class="g2"><text class="title" x="600" y="138" text-anchor="middle" fill="#3a3f45" opacity="0.9">LORENZO LEOGNANO</text></g>
  <text class="title" x="600" y="138" text-anchor="middle" fill="#ffffff">LORENZO LEOGNANO</text>

  <text class="sub" x="600" y="178" text-anchor="middle">STUDENT OF CYBERSECURITY</text>

  <rect x="200" y="196" width="800" height="1" fill="url(#sep)"/>

  <!-- terminal -->
  <g clip-path="url(#c1)"><text class="term" x="350" y="242"><tspan class="dim">$ </tspan>whoami<tspan class="dim"> → </tspan>lorenzo_leognano</text></g>
  <g clip-path="url(#c2)"><text class="term" x="350" y="276"><tspan class="dim">$ </tspan>role&#160;&#160;<tspan class="dim"> → </tspan>student of cybersecurity</text></g>
  <g clip-path="url(#c3)"><text class="term" x="350" y="310"><tspan class="dim">$ </tspan>focus&#160;<tspan class="dim"> → </tspan>cybersecurity &amp; development</text></g>
  <g clip-path="url(#c4)"><text class="term" x="350" y="344"><tspan class="dim">$ </tspan>stack&#160;<tspan class="dim"> → </tspan>python · php · js · mysql</text></g>

  <g opacity="0">
    <set attributeName="opacity" to="1" begin="6.7s" fill="freeze"/>
    <rect class="blink" x="682" y="330" width="10" height="18" fill="#ffffff"/>
  </g>

  <!-- vignette and border -->
  <rect width="1200" height="420" rx="12" fill="url(#vig)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="12" fill="none" stroke="#30363d"/>
</svg>
